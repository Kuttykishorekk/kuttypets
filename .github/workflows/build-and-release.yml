name: Build and Release KuttyPets

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # 1. Build Windows Executable (.exe)
  # ------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow pywin32
          pip install -e .[windows]

      - name: Build Standalone Executable
        run: |
          pyinstaller packaging/windows/kuttypets.spec

      - name: Package Windows Artifact
        shell: pwsh
        run: |
          Compress-Archive -Path dist/KuttyPets.exe -DestinationPath KuttyPets-Windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KuttyPets-Windows-x64
          path: KuttyPets-Windows-x64.zip

  # ------------------------------------------------------------------
  # 2. Build macOS Application Bundle (.app / .zip)
  # ------------------------------------------------------------------
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow pyobjc-framework-Cocoa pyobjc-framework-Quartz
          pip install -e .[macos]

      - name: Build macOS App Bundle
        run: |
          pyinstaller --name "KuttyPets" \
                      --windowed \
                      --noconfirm \
                      --add-data "kuttypets/characters:kuttypets/characters" \
                      --osx-bundle-identifier "com.kutty.kuttypets" \
                      kuttypets/main.py

      - name: Package macOS Artifact
        run: |
          cd dist
          zip -r ../KuttyPets-macOS.zip KuttyPets.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KuttyPets-macOS
          path: KuttyPets-macOS.zip

  # ------------------------------------------------------------------
  # 3. Build Linux Portable Binary (.tar.gz)
  # ------------------------------------------------------------------
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev libcairo2-dev gir1.2-gtk-3.0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow PyGObject pycairo
          pip install -e .[linux]

      - name: Build Linux Standalone Binary
        run: |
          pyinstaller --name "kuttypets" \
                      --onefile \
                      --noconfirm \
                      --add-data "kuttypets/characters:kuttypets/characters" \
                      kuttypets/main.py

      - name: Package Linux Artifact
        run: |
          mkdir -p dist/kuttypets-linux/bin dist/kuttypets-linux/share/applications
          cp dist/kuttypets dist/kuttypets-linux/bin/
          cp packaging/linux/kuttypets.desktop dist/kuttypets-linux/share/applications/
          tar -czvf KuttyPets-Linux-x64.tar.gz -C dist kuttypets-linux

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KuttyPets-Linux-x64
          path: KuttyPets-Linux-x64.tar.gz

  # ------------------------------------------------------------------
  # 4. Create GitHub Release
  # ------------------------------------------------------------------
  release:
    needs: [build-windows, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Display downloaded files
        run: ls -R

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            KuttyPets-Windows-x64/KuttyPets-Windows-x64.zip
            KuttyPets-macOS/KuttyPets-macOS.zip
            KuttyPets-Linux-x64/KuttyPets-Linux-x64.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
